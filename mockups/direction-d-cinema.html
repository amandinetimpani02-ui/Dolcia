<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolcia — Deux rythmes : première fois / ouvertures suivantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--display:"Playfair Display",Georgia,serif;--sans:"Manrope",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{color:#faf6ee;font-family:var(--sans)}
  .film{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
  .photo{position:absolute;inset:0;background:url('../assets/hero-le-touquet.png') center/cover;
    opacity:0;transform:scale(1.06)}
  .scrim{position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.25) 35%,transparent 60%);opacity:0}
  .content{position:relative;z-index:2;padding:0 clamp(24px,7vw,70px) clamp(56px,8vw,84px);opacity:0}
  .kicker{font-family:var(--display);font-style:italic;font-size:clamp(20px,3.2vw,32px);
    color:#faf6ee;margin:0 0 20px;max-width:14ch;line-height:1.15}
  .cta{display:inline-flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;
    color:#faf6ee;font-family:var(--display);font-size:clamp(15px,1.8vw,18px);cursor:pointer}
  .cta b{color:#f0dba5;font-weight:500;font-size:1.15em;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .cta:hover b{transform:translateX(6px)}
  .skip{position:fixed;top:20px;right:20px;z-index:3;background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);font-size:11px;border-radius:999px;
    padding:7px 14px;cursor:pointer;opacity:0}

  /* Rythme 1 — première découverte : 5 à 7 secondes maximum jusqu'à l'action, jamais plus. */
  body.first .photo{animation:reveal 1.8s cubic-bezier(.22,1,.36,1) .2s forwards}
  body.first .scrim{animation:fadeIn 1.4s ease .6s forwards}
  body.first .content{animation:fadeIn 1s ease 2.4s forwards}
  body.first .kicker{opacity:0;transform:translateY(10px);animation:rise 1s cubic-bezier(.16,1,.3,1) 2.4s forwards}
  body.first .cta{opacity:0;transform:translateY(8px);animation:rise .9s cubic-bezier(.16,1,.3,1) 3.6s forwards}
  body.first .skip{animation:fadeIn .6s ease .8s forwards}

  /* Rythme 2 — ouvertures suivantes : moins de 1,5 seconde, aucune introduction, transition légère. */
  body.repeat .photo,body.repeat .scrim,body.repeat .content,body.repeat .kicker,body.repeat .cta{opacity:1;transform:none}
  body.repeat .photo,body.repeat .scrim,body.repeat .content{animation:fadeIn .4s ease forwards}
  body.repeat .skip{display:none}

  @keyframes reveal{to{opacity:1;transform:scale(1)}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .switcher{position:fixed;bottom:16px;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:8px}
  .switcher button{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:#faf6ee;
    font-size:11px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .switcher button.active{background:#f0dba5;color:#1a1508;border-color:#f0dba5}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body class="first">
<div class="film">
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="content">
    <p class="kicker">Aujourd'hui mérite mieux que l'ordinaire.</p>
    <button class="cta">Laissez-vous guider <b>→</b></button>
  </div>
</div>
<button class="skip">Passer</button>
<div class="switcher">
  <button class="active" onclick="setRhythm('first',this)">1ère découverte (5-7s)</button>
  <button onclick="setRhythm('repeat',this)">Ouvertures suivantes (&lt;1,5s)</button>
</div>
<script>
function setRhythm(mode,btn){
  document.body.className=mode;
  document.querySelectorAll('.switcher button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // Relance l'animation à chaque bascule pour pouvoir comparer plusieurs fois de suite.
  void document.body.offsetWidth;
  document.body.className='';
  requestAnimationFrame(()=>document.body.className=mode);
}
</script>
</body>
</html>
