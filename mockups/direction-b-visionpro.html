<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolcia — Direction B · Vision Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--display:"Playfair Display",Georgia,serif;--sans:"Manrope",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;overflow:hidden;background:#040404;color:#f5f0e5;font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;position:relative}

  /* Scène de fond : profondeur par calques flous colorés, pas une photo plate. */
  .depth-field{position:absolute;inset:0;z-index:0}
  .depth-field i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;transition:transform .4s ease-out}
  .b1{width:520px;height:520px;background:#3a6b6a;top:-140px;left:-120px}
  .b2{width:480px;height:480px;background:#5b3a2a;bottom:-160px;right:-100px}
  .b3{width:340px;height:340px;background:#7a5a2c;top:30%;right:10%}

  .stage{position:relative;z-index:2;width:min(420px,88vw);perspective:1200px}

  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,240,229,.5);
    text-align:center;margin-bottom:22px}

  /* Signature : le panneau qui flotte, avec verre dépoli réel (mêmes valeurs que le vrai produit),
     reflet net sur le bord, ombre qui le détache du fond — la vraie marque de Liquid Glass. */
  .glass{
    position:relative;border-radius:28px;padding:34px 30px;
    background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.6), inset 0 1px rgba(255,255,255,.15);
    transform-style:preserve-3d; transition:transform .15s ease-out;
  }
  .glass::before{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6) 45%,rgba(255,255,255,.6) 55%,transparent)}
  .glass h1{font-family:var(--display);font-weight:500;font-size:15px;font-style:italic;
    color:#f0dba5;margin:0 0 12px}
  .glass h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.05;margin:0 0 12px}
  .glass p{font-size:13px;line-height:1.55;color:rgba(245,240,229,.72);margin:0 0 24px}

  .cta{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:16px;
    background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);
    color:#faf6ee;font-weight:600;font-size:13px;cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s ease}
  .cta:hover{transform:translateY(-3px);background:rgba(255,255,255,.18)}

  /* Petit panneau secondaire qui flotte derrière, pour la sensation de profondeur multi-plans. */
  .float-chip{position:absolute;right:-18px;top:-22px;padding:10px 14px;border-radius:14px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.16);
    font-size:11px;color:rgba(245,240,229,.85);box-shadow:0 14px 40px -10px rgba(0,0,0,.5);
    transform:translateZ(40px)}

  .footer{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;
    color:rgba(245,240,229,.4);z-index:2}
  .footer b{color:#d9b878}
</style>
</head>
<body>
  <div class="depth-field"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div class="stage">
    <p class="kicker">Le Touquet · mardi, 09:14</p>
    <div class="glass" id="glass">
      <div class="float-chip">☔ Pluie prévue à 11h</div>
      <h1>Il pleut… mais j'ai une idée.</h1>
      <h2>Concert exceptionnel</h2>
      <p>Ce soir · Boulogne-sur-Mer — une soirée rare, jamais proposée cette saison.</p>
      <button class="cta">L'intégrer à mon moment <span>→</span></button>
    </div>
  </div>
  <p class="footer">Direction B — <b>Vision Pro</b> · profondeur, verre, lumière (déplacez la souris)</p>
<script>
  const glass=document.getElementById('glass'),blobs=document.querySelectorAll('.depth-field i');
  document.addEventListener('mousemove',e=>{
    const x=(e.clientX/window.innerWidth-.5), y=(e.clientY/window.innerHeight-.5);
    glass.style.transform=`rotateY(${x*6}deg) rotateX(${-y*6}deg)`;
    blobs.forEach((b,i)=>b.style.transform=`translate(${x*(14+i*6)}px,${y*(14+i*6)}px)`);
  });
</script>
</body>
</html>
