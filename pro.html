<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dolcia Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold2:#E8CC72;--ink:#07070A;--card:#111116}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 10%,rgba(201,168,76,.16),transparent 35%),var(--ink);color:#fff;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:rgba(17,17,22,.82);border:1px solid rgba(201,168,76,.22);border-radius:28px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.45)}.logo{font-family:'Cormorant Garamond',serif;font-size:42px;letter-spacing:.18em;color:var(--gold2);font-weight:300}.ey{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:rgba(201,168,76,.65);margin:10px 0 18px}h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;line-height:1.05;margin:0 0 14px}p{color:rgba(255,255,255,.58);line-height:1.7;font-size:14px}.pill{display:inline-block;margin-top:14px;border:1px solid rgba(201,168,76,.28);border-radius:999px;padding:9px 14px;color:var(--gold2);font-size:12px}.warn{margin-top:18px;color:rgba(255,255,255,.35);font-size:12px}</style>
</head>
<body><main class="card"><div class="logo">DOLCIA</div><div class="ey">Espace Pro</div><h1>Partenaires & visibilité</h1><p>Cet espace est réservé aux partenaires Dolcia. Les offres, tarifs et options premium ne sont pas affichés publiquement.</p><div class="pill">contact.dolcia@gmail.com</div><div class="warn">Accès privé — ne pas diffuser publiquement.</div></main></body>
</html>
